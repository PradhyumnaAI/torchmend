[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchmend"
version = "0.1.0"
description = "Runtime-augmented local & cloud debugger for Python and PyTorch"
requires-python = ">=3.10"
dependencies = [
    "ruff>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]